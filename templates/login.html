<!-- background shapes -->
  <img class="img-fluid hero-bg-1 up-down-animation" src="{{ url_for('static', filename='assets/images/background-shape/feature-bg-2.png') }}" alt="">
  <img class="img-fluid hero-bg-2 left-right-animation" src="{{ url_for('static', filename='assets/images/background-shape/seo-ball-1.png') }}" alt="">
  <img class="img-fluid hero-bg-3 left-right-animation" src="{{ url_for('static', filename='assets/images/background-shape/seo-half-cycle.png') }}" alt="">

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-head">
      <img class="auth-logo" src="{{ url_for('static', filename='assets/images/logo.png') }}" alt="Simplify">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in to scan a photo and get guidance on what it might be.</p>
    </div>

    {% if us %}
    <div class="auth-alert {{ 'ok' if ok else 'err' }}">{{ us }}</div>
    {% endif %}

    <form method="POST" id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg>
          <input type="email" id="email" name="name" placeholder="you@example.com" required autocomplete="email" autofocus>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="password" name="pass" placeholder="Your password" required autocomplete="current-password">
          <button type="button" class="toggle-pass" data-target="password">Show</button>
        </div>
      </div>

      <div class="auth-row">
        <button type="submit" class="btn-link" name="id" value="forgot">Forgot password?</button>
      </div>

      <button type="submit" class="btn-auth" name="id" value="login" id="submitBtn">Log in</button>
    </form>

    <p class="auth-note">Forgot your password? Enter your email above and hit “Forgot password?” — we'll send a reset link.</p>

    <div class="auth-foot">
      Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a>
    </div>

  </div>
</div>
